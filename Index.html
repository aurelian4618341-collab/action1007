<!doctype html>
<html lang="zh-Hant"><head><base target="_top"><meta charset="utf-8">
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#334155;background:#f8fafc;margin:0;padding:24px}.container{max-width:1100px;margin:auto}h1{text-align:center}section{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:24px;margin:20px 0}label{display:block;font-weight:bold;margin:18px 0 8px}input,select{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}button{padding:12px 18px;border:0;border-radius:8px;cursor:pointer;font:inherit;background:#334155;color:white;margin:6px 8px 6px 0}button.secondary{background:#e2e8f0;color:#334155}button.danger{background:#b91c1c}button:disabled{opacity:.5;cursor:wait}.groups{display:flex;gap:12px}.groups label{flex:1;border:1px solid #cbd5e1;border-radius:12px;padding:16px;font-weight:normal;margin:0}.groups input{width:auto}.groups small{display:block;margin-top:8px}.tableWrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:12px;border-bottom:1px solid #e2e8f0}#status{white-space:pre-wrap}#status.error{color:#b91c1c}.hint{color:#64748b}@media(max-width:600px){body{padding:12px}.groups{flex-direction:column}section{padding:16px}}
</style></head><body><main class="container">
<h1>營隊報名資料管理</h1><p class="hint">新增、修改與刪除的結果會儲存至 Google 試算表。</p>
<section><label for="token">管理金鑰</label><input id="token" type="password" autocomplete="off" placeholder="輸入 API_TOKEN"><button id="load" type="button">載入資料</button><p class="hint">管理金鑰僅保留於此頁面，不寫入試算表。</p></section>
<section><h2 id="formTitle">填寫報名資料</h2>
<form id="form"><label for="studentId">學號 *</label><input id="studentId" required maxlength="50" placeholder="例如：B11305001">
<label for="name">姓名 *</label><input id="name" required maxlength="100" placeholder="例如：林小明">
<label>選擇報名分組 *</label><div class="groups">
<label><input type="radio" name="group" value="A 組－金融科技與量化" required> A 組<small>金融科技與量化</small></label>
<label><input type="radio" name="group" value="B 組－行為經濟與實驗"> B 組<small>行為經濟與實驗</small></label>
<label><input type="radio" name="group" value="C 組－個案與商業策略"> C 組<small>個案與商業策略</small></label></div>
<label for="email">電子信箱 *</label><input id="email" type="email" required maxlength="254" placeholder="例如：student@university.edu.tw">
<button id="save" type="submit">新增報名</button><button id="cancel" type="button" class="secondary">清空／取消修改</button></form></section>
<p id="status" role="status" aria-live="polite"></p>
<section><h2>報名名單</h2><div class="tableWrap"><table><thead><tr><th>學號</th><th>姓名</th><th>分組</th><th>電子信箱</th><th>填寫時間</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main><script>
const $=id=>document.getElementById(id);let records=[],editing=null,busy=false;
function message(text,error=false){$('status').textContent=text;$('status').className=error?'error':'';}
function setBusy(value){busy=value;document.querySelectorAll('button,input').forEach(el=>el.disabled=value);}
function call(request){return new Promise((resolve,reject)=>{
  const token=$('token').value.trim();if(!token)return reject(new Error('請先輸入管理金鑰。'));
  google.script.run.withSuccessHandler(result=>result.ok?resolve(result.data):reject(new Error(result.error)))
    .withFailureHandler(error=>reject(new Error(error.message||String(error))))
    .handleRequest({...request,token});
});}
function reset(){editing=null;$('form').reset();$('formTitle').textContent='填寫報名資料';$('save').textContent='新增報名';}
function render(){const body=$('rows');body.replaceChildren();if(!records.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=6;td.textContent='尚無報名資料';tr.append(td);body.append(tr);return;}
 records.forEach(record=>{const tr=document.createElement('tr');[record.studentId,record.name,record.group,record.email,record.createdAt?new Date(record.createdAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):''].forEach(value=>{const td=document.createElement('td');td.textContent=value;tr.append(td);});
 const td=document.createElement('td'),edit=document.createElement('button'),del=document.createElement('button');edit.textContent='修改';edit.onclick=()=>{editing=record;$('studentId').value=record.studentId;$('name').value=record.name;$('email').value=record.email;document.querySelectorAll('input[name="group"]').forEach(el=>el.checked=el.value===record.group);$('formTitle').textContent='修改報名資料';$('save').textContent='儲存修改';$('form').scrollIntoView({behavior:'smooth'});};
 del.textContent='刪除';del.className='danger';del.onclick=()=>remove(record);td.append(edit,del);tr.append(td);body.append(tr);});}
async function refresh(){records=await call({action:'list'});render();}
async function task(operation){if(busy)return;setBusy(true);message('處理中…');try{await operation();}catch(error){message(error.message,true);}finally{setBusy(false);}}
$('load').onclick=()=>task(async()=>{await refresh();reset();message('資料已載入，共 '+records.length+' 筆。');});
$('cancel').onclick=reset;
$('form').onsubmit=event=>{event.preventDefault();if(!$('form').reportValidity())return;task(async()=>{
 const selected=document.querySelector('input[name="group"]:checked');const data={studentId:$('studentId').value,name:$('name').value,group:selected.value,email:$('email').value};
 const action=editing?'update':'create';const result=await call({action,data,...(editing?{id:editing.id,updatedAt:editing.updatedAt}:{})});
 if(editing)records=records.map(r=>r.id===result.id?result:r);else records.push(result);render();reset();message(action==='update'?'修改已儲存。':'新增成功。');
 });};
function remove(record){if(!confirm('確定刪除「'+record.name+'」（'+record.studentId+'）的報名資料？'))return;task(async()=>{await call({action:'delete',id:record.id,updatedAt:record.updatedAt});records=records.filter(r=>r.id!==record.id);if(editing&&editing.id===record.id)reset();render();message('資料已刪除。');});}
</script></body></html>
